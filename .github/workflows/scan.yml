name: Daily competitor scan

on:
  schedule:
    # 05:17 UTC: 5:17am Irish time in winter, 6:17am in summer. GitHub can start it a little late.
    - cron: "17 5 * * *"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand
  push:                   # runs by itself whenever you upload a new version of these files
    branches: [main]
    paths:
      - pricewatch.py
      - matches.csv
      - config.yaml

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan shops, build page, send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python pricewatch.py
      - name: Save today's results
        run: |
          git config user.name "price-watch"
          git config user.email "price-watch@users.noreply.github.com"
          git add -A data docs
          git commit -m "Scan $(date -u +%F)" || echo "nothing to commit"
          # if files were changed on GitHub while the scan ran, catch up before saving
          git pull --rebase -X theirs origin main
          git push
